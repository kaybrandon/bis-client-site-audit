services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    volumes:
      - bis-sql:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: src/BisAudit.Api/Dockerfile
    ports:
      - "5088:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=BisAudit;User Id=sa;Password=Your_password123;TrustServerCertificate=True;MultipleActiveResultSets=true
      Seed__LoadSampleAudit: "true"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  bis-sql:
